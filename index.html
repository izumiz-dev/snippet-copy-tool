<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Snippet Management</title>
  <link rel="stylesheet" href="./index.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="light-mode">
  <div class="app-wrapper">
    <header class="app-header">
      <div class="app-title">
        <span class="material-icons app-title-icon">snippet_folder</span>
        Snippet Management
      </div>
      <div class="header-actions">
        <button id="toggle-theme" class="icon-button" title="Toggle theme">
          <span id="theme-icon" class="material-icons">dark_mode</span>
          <span id="theme-text" class="sr-only">Switch to dark mode</span>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-button active" data-tab="snippets">
        <span class="material-icons">content_paste</span>
        Snippets
      </button>
      <button class="tab-button" data-tab="settings">
        <span class="material-icons">settings</span>
        Settings
      </button>
    </nav>

    <main class="app-container">
      <div id="snippets" class="tab-content active">
        <div class="snippets-container">
          <aside class="sidebar">
            <div class="sidebar-header">
              <div class="sidebar-title">
                <span class="material-icons">list</span>
                Snippet List
                <span id="snippet-count" class="snippet-count">0</span>
              </div>
              <div class="sidebar-controls">
                <button id="new-snippet" class="icon-button primary" title="Create new snippet">
                  <span class="material-icons">add</span>
                </button>
              </div>
            </div>

            <div class="search-container">
              <input type="text" id="search-snippets" class="search-input" placeholder="Search snippets..." />
            </div>

            <div id="snippet-list" class="snippet-list">
            </div>
          </aside>

          <div class="editor-container">
            <div class="editor-header">
              <h2 id="content-title" class="editor-title">Select or create a snippet</h2>
              <div class="editor-actions">
                <button id="save" class="button button-primary">
                  <span class="material-icons">save</span>
                  Save
                </button>
                <button id="delete" class="button button-danger">
                  <span class="material-icons">delete</span>
                  Delete
                </button>
              </div>
            </div>

            <div class="editor-content">
              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Snippet title">
              </div>

              <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                <label for="content">Content</label>
                <textarea id="content" placeholder="Snippet content"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="settings" class="tab-content" style="display: none;">
        <div class="settings-container">
          <section class="settings-section">
            <h2 class="settings-section-title">Shortcut Settings</h2>

            <div class="settings-option">
              <div class="settings-option-label">Shortcut key to show snippet selector window</div>
              <div class="settings-option-description">Press a key combination to set the shortcut (e.g. Alt+S)</div>

              <div class="shortcut-input-group">
                <input type="text" id="shortcut-input" placeholder="Enter shortcut..." readonly>
                <button id="clear-shortcut" class="button button-outline">Clear</button>
                <button id="reset-shortcut" class="button button-outline">Reset</button>
                <button id="save-shortcut" class="button button-primary">Save</button>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h2 class="settings-section-title">Version Info</h2>
            <div class="settings-option">
              <div class="settings-option-description">Version: 1.0.0</div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="status-bar">
      <div class="status-item">
        <span class="material-icons" style="font-size: 16px">keyboard</span>
        <span id="current-shortcut">Alt+S</span>
      </div>
      <div class="status-item">
        <span class="material-icons" style="font-size: 16px">info</span>
        <span>Ctrl+N: New | Ctrl+S: Save</span>
      </div>
    </footer>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    const { ipcRenderer } = require('electron');

    let snippets = [];
    let selectedSnippet = null;
    let settings = { shortcut: 'Alt+S' };
    let currentInput = '';
    let filteredSnippets = [];
    let isDarkMode = false;

    const snippetListElement = document.getElementById('snippet-list');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const contentTitleElement = document.getElementById('content-title');
    const saveButton = document.getElementById('save');
    const newSnippetButton = document.getElementById('new-snippet');
    const deleteButton = document.getElementById('delete');
    const searchInput = document.getElementById('search-snippets');
    const currentShortcutSpan = document.getElementById('current-shortcut');
    const snippetCountElement = document.getElementById('snippet-count');
    const toggleThemeButton = document.getElementById('toggle-theme');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const tabId = button.getAttribute('data-tab');

        // Toggle active state for tab buttons
        tabButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        // Toggle visibility for tab content
        tabContents.forEach(content => {
          if (content.id === tabId) {
            content.style.display = 'block';
          } else {
            content.style.display = 'none';
          }
        });
      });
    });

    /**
     * Sends a request to the main process to reload snippets.
     */
    function reloadSnippets() {
      ipcRenderer.send('get-snippets');
    }

    /**
     * Renders the list of snippets in the UI.
     * Uses either the full list or filtered list based on search input.
     * Displays an empty state message if no snippets are available.
     */
    function renderSnippetList() {
      snippetListElement.innerHTML = '';
      const snippetsToRender = searchInput.value ? filteredSnippets : snippets;

      if (snippetsToRender.length === 0) {
        const emptyMessage = document.createElement('div');
        emptyMessage.className = 'empty-state';
        emptyMessage.innerHTML = searchInput.value
          ? `No snippets found matching "${searchInput.value}"`
          : 'No snippets yet.<br>Create one using the + button above.';
        snippetListElement.appendChild(emptyMessage);
        return;
      }

      snippetsToRender.forEach(snippet => {
        const item = document.createElement('div');
        item.className = 'snippet-item';
        if (selectedSnippet && snippet.id === selectedSnippet.id) {
          item.classList.add('selected');
        }

        const header = document.createElement('div');
        header.className = 'snippet-item-header';

        const title = document.createElement('div');
        title.className = 'snippet-item-title';
        title.textContent = snippet.title;

        header.appendChild(title);
        item.appendChild(header);

        const preview = document.createElement('div');
        preview.className = 'snippet-item-preview';
        preview.textContent = snippet.content;
        item.appendChild(preview);

        item.addEventListener('click', () => {
          selectSnippet(snippet);
        });

        snippetListElement.appendChild(item);
      });

      snippetCountElement.textContent = snippets.length;
    }

    /**
     * Selects a snippet and updates the editor fields.
     * @param {object} snippet - The snippet object to select.
     */
    function selectSnippet(snippet) {
      selectedSnippet = snippet;
      titleInput.value = snippet.title;
      contentInput.value = snippet.content;
      contentTitleElement.textContent = snippet.title || 'Edit Snippet';
      renderSnippetList();
    }

    /**
     * Clears the editor fields to create a new snippet.
     */
    function createNewSnippet() {
      selectedSnippet = { id: null, title: '', content: '' };
      titleInput.value = '';
      contentInput.value = '';
      contentTitleElement.textContent = 'New Snippet';
      renderSnippetList();
      titleInput.focus();
    }

    /**
     * Filters the snippet list based on the provided query.
     * Updates the rendered list.
     * @param {string} query - The search query.
     */
    function filterSnippets(query) {
      if (!query) {
        filteredSnippets = [];
        renderSnippetList();
        return;
      }

      const lowerQuery = query.toLowerCase();
      filteredSnippets = snippets.filter(snippet => {
        return snippet.title.toLowerCase().includes(lowerQuery) ||
          snippet.content.toLowerCase().includes(lowerQuery);
      });

      renderSnippetList();
    }

    /**
     * Displays a toast notification message.
     * @param {string} message - The message to display.
     * @param {'info' | 'success' | 'error'} [type='info'] - The type of toast.
     */
    function showToast(message, type = 'info') {
      const toastContainer = document.getElementById('toast-container');

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      const icon = document.createElement('span');
      icon.className = 'material-icons';

      switch (type) {
        case 'success':
          icon.textContent = 'check_circle';
          break;
        case 'error':
          icon.textContent = 'error';
          break;
        default:
          icon.textContent = 'info';
      }

      toast.appendChild(icon);

      const text = document.createElement('span');
      text.textContent = message;
      toast.appendChild(text);

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => {
          toastContainer.removeChild(toast);
        }, 300);
      }, 3000);
    }

    /**
     * Toggles the color theme between light and dark mode.
     * Updates the body class and theme toggle button appearance.
     */
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.body.classList.remove('light-mode', 'dark-mode');
      document.body.classList.add(isDarkMode ? 'dark-mode' : 'light-mode');

      themeIcon.textContent = isDarkMode ? 'light_mode' : 'dark_mode';
      themeText.textContent = isDarkMode ? 'Switch to light mode' : 'Switch to dark mode';
    }

    // Event Listeners Setup
    newSnippetButton.addEventListener('click', createNewSnippet);

    saveButton.addEventListener('click', () => {
      if (!titleInput.value.trim()) {
        showToast('Please enter a title', 'error');
        titleInput.focus();
        return;
      }

      const snippet = {
        id: selectedSnippet ? selectedSnippet.id : null,
        title: titleInput.value.trim(),
        content: contentInput.value
      };

      ipcRenderer.send('save-snippet', snippet);
      showToast('Snippet saved', 'success');
    });

    deleteButton.addEventListener('click', () => {
      if (!selectedSnippet || selectedSnippet.id === null) {
        showToast('Please select a snippet to delete', 'error');
        return;
      }

      if (confirm(`Delete snippet "${selectedSnippet.title}"?`)) {
        ipcRenderer.send('delete-snippet', selectedSnippet.id);
        showToast('Snippet deleted', 'info');
      }
    });

    searchInput.addEventListener('input', (e) => {
      filterSnippets(e.target.value);
    });

    toggleThemeButton.addEventListener('click', toggleTheme);

    // IPC Event Handlers
    /**
     * Handles the 'snippets-updated' event from the main process.
     * Updates the local snippets array and re-renders the list.
     * Also handles cases where the currently selected snippet might have been deleted.
     */
    ipcRenderer.on('snippets-updated', (event, updatedSnippets) => {
      snippets = updatedSnippets;

      if (searchInput.value) {
        filterSnippets(searchInput.value);
      }

      if (selectedSnippet) {
        const stillExists = snippets.find(s => s.id === selectedSnippet.id);
        if (!stillExists) {
          selectedSnippet = null;
          titleInput.value = '';
          contentInput.value = '';
          contentTitleElement.textContent = 'Select or create a snippet';
        } else {
          const updated = snippets.find(s => s.id === selectedSnippet.id);
          if (updated) {
            titleInput.value = updated.title;
            contentInput.value = updated.content;
            contentTitleElement.textContent = updated.title;
          }
        }
      }

      renderSnippetList();
    });

    /**
     * Handles the 'theme-changed' event from the main process.
     * Updates the UI theme based on the received dark mode status.
     */
    ipcRenderer.on('theme-changed', (event, darkMode) => {
      isDarkMode = darkMode;
      document.body.classList.remove('light-mode', 'dark-mode');
      document.body.classList.add(isDarkMode ? 'dark-mode' : 'light-mode');

      themeIcon.textContent = isDarkMode ? 'light_mode' : 'dark_mode';
      themeText.textContent = isDarkMode ? 'Switch to light mode' : 'Switch to dark mode';
    });

    // Shortcut Settings Elements and Logic
    const shortcutInput = document.getElementById('shortcut-input');
    const clearShortcutButton = document.getElementById('clear-shortcut');
    const resetShortcutButton = document.getElementById('reset-shortcut');
    const saveShortcutButton = document.getElementById('save-shortcut');

    shortcutInput.addEventListener('click', () => {
      shortcutInput.value = '';
      shortcutInput.placeholder = 'Press keys...';
    });

    shortcutInput.addEventListener('keydown', (e) => {
      e.preventDefault();

      if (e.key === 'Control' || e.key === 'Alt' || e.key === 'Shift' || e.key === 'Meta') {
        return;
      }

      let shortcut = [];

      if (e.ctrlKey) shortcut.push('Ctrl');
      if (e.altKey) shortcut.push('Alt');
      if (e.shiftKey) shortcut.push('Shift');
      if (e.metaKey) shortcut.push('Super');

      const specialKeys = {
        ' ': 'Space',
        'ArrowUp': 'Up',
        'ArrowDown': 'Down',
        'ArrowLeft': 'Left',
        'ArrowRight': 'Right'
      };

      const keyName = specialKeys[e.key] || e.key;
      shortcut.push(keyName);

      const shortcutStr = shortcut.join('+');
      shortcutInput.value = shortcutStr;
      currentInput = shortcutStr;
    });

    clearShortcutButton.addEventListener('click', () => {
      shortcutInput.value = '';
      currentInput = '';
      shortcutInput.placeholder = 'Enter shortcut...';
    });

    resetShortcutButton.addEventListener('click', () => {
      currentInput = 'Alt+S';
      shortcutInput.value = currentInput;
    });

    saveShortcutButton.addEventListener('click', () => {
      if (!currentInput) {
        showToast('Please enter a shortcut', 'error');
        return;
      }

      ipcRenderer.send('update-shortcut', currentInput);
    });

    /**
     * Handles the 'settings-updated' event from the main process.
     * Updates the local settings object and UI elements displaying the shortcut.
     */
    ipcRenderer.on('settings-updated', (event, updatedSettings) => {
      settings = updatedSettings;
      currentShortcutSpan.textContent = settings.shortcut;
      currentInput = settings.shortcut;
      shortcutInput.value = currentInput;
    });

    /**
     * Handles the 'shortcut-updated' event from the main process.
     * Shows a toast notification indicating success or failure of the update.
     */
    ipcRenderer.on('shortcut-updated', (event, result) => {
      if (result.success) {
        showToast(`Shortcut set to "${result.shortcut}"`, 'success');
      } else {
        showToast(`Failed to set shortcut "${result.shortcut}". Try another combination.`, 'error');
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      // Ctrl+N: Create new snippet
      if (e.ctrlKey && e.key === 'n') {
        e.preventDefault();
        createNewSnippet();
      }

      // Ctrl+S: Save current snippet
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        if (selectedSnippet) {
          saveButton.click();
        }
      }

      // Escape: Clear search input if focused
      if (e.key === 'Escape') {
        if (document.activeElement === searchInput && searchInput.value) {
          searchInput.value = '';
          filterSnippets('');
        }
      }
    });

    /**
     * Sends a request to the main process to load settings.
     */
    function loadSettings() {
      ipcRenderer.send('get-settings');
    }

    // Initial Load
    reloadSnippets();
    loadSettings();
  </script>
</body>

</html>
