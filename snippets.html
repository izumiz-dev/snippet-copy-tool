<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Snippet Selection</title>
  <style>
    .folder-tabs {
      display: flex;
      border-bottom: 1px solid #eee;
      padding: 0 8px;
      overflow-x: auto;
      background-color: inherit;
    }

    .folder-tab {
      padding: 8px 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .folder-tab.active {
      border-bottom-color: #007bff;
    }

    body.dark-mode .folder-tabs {
      border-bottom-color: #444;
    }

    body.dark-mode .folder-tab.active {
      border-bottom-color: #007bff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .snippet-list {
      max-height: 350px;
      overflow-y: auto;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: var(--text-secondary);
    }

    .folder-tab.active {
      background-color: rgba(0, 123, 255, 0.1);
    }

    .snippet-item {
      padding: 4px 8px;
      cursor: pointer;
      transition: background-color 0.2s, border-bottom-color 0.2s;
    }

    .snippet-title {
      font-weight: bold;
      margin-bottom: 2px;
      transition: color 0.3s;
    }

    .snippet-preview {
      font-size: 0.75em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
      display: block;
      width: 100%;
    }

    body.light-mode {
      background-color: #f5f5f5;
      color: #333;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    body.light-mode .snippet-item {
      border-bottom: 1px solid #eee;
    }

    body.light-mode .folder-tab:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    body.light-mode .snippet-item:hover {
      background-color: #e0e0e0;
    }

    body.light-mode .snippet-title {
      color: #333;
    }

    body.light-mode .snippet-preview {
      color: #666;
    }

    body.dark-mode {
      background-color: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #444;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    body.dark-mode .snippet-item {
      border-bottom: 1px solid #444;
    }

    body.dark-mode .folder-tab:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    body.dark-mode .snippet-item:hover {
      background-color: #3d3d3d;
    }

    body.dark-mode .snippet-title {
      color: #e0e0e0;
    }

    body.dark-mode .snippet-preview {
      color: #aaa;
    }

    /* Style for focused elements */
    .folder-tab.focused,
    .snippet-item.focused {
      background-color: rgba(0, 123, 255, 0.2); /* Example focus style */
      outline: 1px solid rgba(0, 123, 255, 0.5);
    }
    body.dark-mode .folder-tab.focused,
    body.dark-mode .snippet-item.focused {
       background-color: rgba(0, 123, 255, 0.3);
       outline: 1px solid rgba(0, 123, 255, 0.7);
    }

  </style>
</head>

<body class="light-mode">
  <div class="folder-tabs" id="folder-tabs"></div>
  <div id="snippets-container" class="snippet-list"></div>

  <script>
    const { ipcRenderer } = require('electron');

    let currentFolderId = 'none'; // 'none' represents "uncategorized"
    let allSnippets = [];
    let folders = [];
    let focusedTabIndex = 0;
    let focusedSnippetIndex = -1; // -1 means no snippet is focused initially

    /**
     * Renders folder tabs based on the provided folders array.
     * @param {Array<{id: string, name: string}>} folderList - Array of folder objects.
     */
    function renderFolderTabs(folderList) {
      const tabsContainer = document.getElementById('folder-tabs');
      tabsContainer.innerHTML = '';
      focusedTabIndex = folderList.findIndex(f => f.id === currentFolderId);
      if (focusedTabIndex === -1 && folderList.length > 0) {
          focusedTabIndex = 0; // Default to first tab if currentFolderId not found
          currentFolderId = folderList[0].id;
      }


      folderList.forEach((folder, index) => {
        const tab = document.createElement('div');
        // Add 'focused' class if it's the currently focused tab
        tab.className = `folder-tab${currentFolderId === folder.id ? ' active' : ''}${index === focusedTabIndex ? ' focused' : ''}`;
        tab.textContent = folder.name;
        tab.setAttribute('data-folder-id', folder.id); // Add data attribute
        tab.addEventListener('click', () => switchFolder(folder.id));
        tabsContainer.appendChild(tab);
      });

      // Ensure the focused tab is visible
      ensureVisible(tabsContainer.querySelector('.folder-tab.focused'));
    }

    /**
     * Switches the current folder and updates the snippet list.
     * @param {string} folderId - The ID of the folder to switch to.
     */
    function switchFolder(folderId) {
      // Don't switch if already the current folder
      if (currentFolderId === folderId) return;

      currentFolderId = folderId;
      focusedTabIndex = folders.findIndex(f => f.id === folderId); // Update focused tab index
      focusedSnippetIndex = -1; // Reset snippet focus when folder changes

      const tabs = document.querySelectorAll('.folder-tab');
      tabs.forEach((tab, index) => {
          tab.classList.remove('active', 'focused');
          if (tab.getAttribute('data-folder-id') === folderId) {
              tab.classList.add('active');
          }
          if (index === focusedTabIndex) {
              tab.classList.add('focused');
          }
      });

      const filteredSnippets = allSnippets.filter(s => s.folderId === currentFolderId);
      renderSnippetList(filteredSnippets);

      // Ensure the newly focused tab is visible
      ensureVisible(document.querySelector('.folder-tab.focused'));
    }

    /**
     * Renders the snippet list based on the provided snippets array.
     * @param {Array<object>} snippets - Array of snippet objects to render.
     */
    function renderSnippetList(snippets) {
      const container = document.getElementById('snippets-container');
      container.innerHTML = '';
      focusedSnippetIndex = -1; // Reset focus

      snippets.sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0));

      if (snippets.length === 0) {
        focusedSnippetIndex = -1; // No snippets to focus
        const emptyMessage = document.createElement('div');
        emptyMessage.className = 'snippet-item';
        emptyMessage.style.textAlign = 'center';
        emptyMessage.style.color = '#666';
        emptyMessage.textContent = 'No snippets in this folder';
        container.appendChild(emptyMessage);
        return;
      }

      snippets.forEach(snippet => {
        const item = document.createElement('div');
        item.className = 'snippet-item';
        item.setAttribute('data-snippet-id', snippet.id);

        const title = document.createElement('div');
        title.className = 'snippet-title';
        title.textContent = snippet.title;

        const preview = document.createElement('div');
        preview.className = 'snippet-preview';
        preview.textContent = snippet.content;

        item.appendChild(title);
        item.appendChild(preview);

        // Set native title attribute for simple tooltip (first 5 lines)
        const previewLines = snippet.content.split('\n').slice(0, 5).join('\n');
        item.setAttribute('title', previewLines);

        item.addEventListener('click', () => {
          ipcRenderer.send('snippet-selected', { id: snippet.id, content: snippet.content });
        });

        container.appendChild(item);
      });

      // Set initial focus to the first snippet if available
      if (snippets.length > 0) {
        focusedSnippetIndex = 0;
        updateSnippetFocus();
      }
    }

    /**
     * Updates the visual focus state for snippets.
     */
    function updateSnippetFocus() {
        const items = document.querySelectorAll('.snippet-item');
        items.forEach((item, index) => {
            if (index === focusedSnippetIndex) {
                item.classList.add('focused');
                ensureVisible(item); // Ensure the focused item is visible
            } else {
                item.classList.remove('focused');
            }
        });
    }

    /**
     * Updates the visual focus state for folder tabs.
     */
    function updateTabFocus() {
        const tabs = document.querySelectorAll('.folder-tab');
        tabs.forEach((tab, index) => {
            if (index === focusedTabIndex) {
                tab.classList.add('focused');
                ensureVisible(tab); // Ensure the focused tab is visible
            } else {
                tab.classList.remove('focused');
            }
        });
        // Also update the active state based on the focused tab's folderId
        const focusedTab = tabs[focusedTabIndex];
        if (focusedTab) {
            switchFolder(focusedTab.getAttribute('data-folder-id'));
        }
    }

    /**
     * Scrolls the container to make the element visible if needed.
     * @param {HTMLElement} element - The element to make visible.
     */
    function ensureVisible(element) {
        if (!element) return;
        element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }

    /**
     * Handles the 'load-snippets' event from the main process.
     * @param {Electron.IpcRendererEvent} event - The IPC event object.
     * @param {{snippets: Array<object>, folders: Array<object>}} data - The snippets and folders data.
     */
    ipcRenderer.on('load-snippets', (event, data) => {
      // Convert all folder names to English ("Uncategorized" for 'none')
      allSnippets = data.snippets;
      folders = data.folders.map(f => f.id === 'none' ? { ...f, name: 'Uncategorized' } : { ...f });
      renderFolderTabs(folders);
      switchFolder(currentFolderId);
    });

    /**
     * Handles the 'theme-changed' event from the main process.
     * @param {Electron.IpcRendererEvent} event - The IPC event object.
     * @param {boolean} isDarkMode - True if dark mode is enabled, false otherwise.
     */
    ipcRenderer.on('theme-changed', (event, isDarkMode) => {
      document.body.classList.remove('light-mode', 'dark-mode');
      document.body.classList.add(isDarkMode ? 'dark-mode' : 'light-mode');
    });

    // --- Keyboard Navigation ---
    document.addEventListener('keydown', (event) => {
        const tabs = document.querySelectorAll('.folder-tab');
        const snippets = document.querySelectorAll('.snippet-item');
        const numTabs = tabs.length;
        const numSnippets = snippets.length;

        // Prevent default scrolling behavior for arrow keys
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
            event.preventDefault();
        }

        switch (event.key) {
            case 'ArrowLeft':
                if (numTabs > 0) {
                    focusedTabIndex = (focusedTabIndex - 1 + numTabs) % numTabs;
                    updateTabFocus();
                }
                break;
            case 'ArrowRight':
                if (numTabs > 0) {
                    focusedTabIndex = (focusedTabIndex + 1) % numTabs;
                    updateTabFocus();
                }
                break;
            case 'ArrowUp':
                if (numSnippets > 0) {
                    // If no snippet is focused, focus the last one
                    if (focusedSnippetIndex === -1) {
                        focusedSnippetIndex = numSnippets - 1;
                    } else {
                        focusedSnippetIndex = (focusedSnippetIndex - 1 + numSnippets) % numSnippets;
                    }
                    updateSnippetFocus();
                }
                break;
            case 'ArrowDown':
                 if (numSnippets > 0) {
                    // If no snippet is focused, focus the first one
                    if (focusedSnippetIndex === -1) {
                        focusedSnippetIndex = 0;
                    } else {
                        focusedSnippetIndex = (focusedSnippetIndex + 1) % numSnippets;
                    }
                    updateSnippetFocus();
                }
                break;
            case 'Enter':
                if (focusedSnippetIndex >= 0 && focusedSnippetIndex < numSnippets) {
                    const focusedSnippet = snippets[focusedSnippetIndex];
                    const snippetIdStr = focusedSnippet.getAttribute('data-snippet-id');
                    // Attempt to convert snippetIdStr to a number for comparison, assuming IDs in allSnippets are numbers
                    const snippetIdNum = parseInt(snippetIdStr, 10); 

                    // Find snippet comparing potentially numeric ID
                    const snippet = allSnippets.find(s => s.id === snippetIdNum); 

                    if (snippet) {
                        ipcRenderer.send('snippet-selected', { id: snippet.id, content: snippet.content });
                    }
                }
                break;
        }
    });
  </script>
</body>

</html>
